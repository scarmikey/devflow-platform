apiVersion: v1
kind: Namespace
metadata:
  name: devflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devflow-api
  namespace: devflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devflow-api
  template:
    metadata:
      labels:
        app: devflow-api
    spec:
      containers:
        - name: api
          image: devflow-api:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
